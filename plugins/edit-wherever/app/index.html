<style>
:root{color-scheme:light;
 --bg:#fffcf9;--surface:#ffffff;--raised:#ffffff;--line:#ece4da;--line-soft:#f4eee6;
 --text:#15161b;--text-2:#4a4650;--muted:#6b646f;
 --brand-a:#ff5c4d;--brand-b:#d93a2c;--brand-c:#f2b85a;
 --u-primary:#17151c;--u-accent:#ff5a3c;--u-bg:#fff7ef;--u-head:"Inter Tight";--u-body:"Inter";
 --good:#0e7a4d;--good-t:#0e7a4d;--kick:#c9301f;--badge:#d93a2c;--bad:#e5483a;--coral:#ff5c4d;--good-soft:rgba(19,160,101,.12);
 --r-xl:26px;--r-lg:20px;--r-md:14px;--r-sm:10px;--ease:cubic-bezier(.23,1,.32,1);
 --f-d:"Fraunces",Georgia,serif;--f-b:"Plus Jakarta Sans",system-ui,sans-serif;--f-h:"Bricolage Grotesque",system-ui,sans-serif;--f-m:"JetBrains Mono",ui-monospace,monospace;
 --shadow:0 1px 0 rgba(255,255,255,.8) inset,0 20px 40px -28px rgba(40,20,60,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#111216;--surface:#1b1c21;--raised:#222329;--line:#2e2f36;--line-soft:#25262c;--text:#f4f1ec;--text-2:#c9c3bb;--muted:#8f8a84;--brand-a:#ff6b5c;--brand-b:#ff5c4d;--brand-c:#f2b85a;--good-t:#3ccf8e;--kick:#ff5c4d;--shadow:0 20px 40px -28px rgba(0,0,0,.7)}}
:root[data-theme=dark]{color-scheme:dark;--bg:#111216;--surface:#1b1c21;--raised:#222329;--line:#2e2f36;--line-soft:#25262c;--text:#f4f1ec;--text-2:#c9c3bb;--muted:#8f8a84;--brand-a:#ff6b5c;--brand-b:#ff5c4d;--brand-c:#f2b85a;--good-t:#3ccf8e;--kick:#ff5c4d;--shadow:0 20px 40px -28px rgba(0,0,0,.7)}
*{box-sizing:border-box}@media(min-width:861px){html{scrollbar-gutter:stable}}html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 var(--f-b);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}a{color:inherit}
:focus-visible{outline:2px solid var(--brand-b);outline-offset:2px;border-radius:8px}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
/* sidebar */
.side{position:sticky;top:0;height:100vh;padding:22px 16px;border-right:1px solid var(--line-soft);display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}.brand svg{width:34px;height:34px;flex:none;border-radius:9px}
.brand b{font:italic 23px/1 var(--f-d);letter-spacing:-.01em}.brand small{display:block;font:600 10.5px var(--f-m);letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-top:3px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:12px;text-decoration:none;color:var(--text-2);font-weight:600;font-size:14.5px}
.nav a svg{width:19px;height:19px;flex:none;opacity:.85}.nav a:hover{background:var(--line-soft);color:var(--text)}
.nav a[aria-current=page]{background:var(--text);color:var(--bg)}.nav a[aria-current=page] svg{opacity:1}
.nav a em{margin-left:auto;font:700 11px var(--f-m);font-style:normal;color:var(--muted)}.nav a[aria-current=page] em{color:inherit;opacity:.7}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line-soft);border-radius:16px;background:var(--raised)}
.av{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font:800 14px var(--f-h);color:#fff;background:linear-gradient(135deg,var(--u-accent),var(--u-primary))}
.me div{min-width:0}.me b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.me span{font-size:12px;color:var(--muted)}
/* main */
main{min-width:0;padding:30px clamp(16px,3.4vw,44px) 110px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.k{font:600 11.5px var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--kick)}
h1{font:italic 600 clamp(34px,4.6vw,56px)/1.02 var(--f-d);letter-spacing:-.015em;margin:6px 0 0}h1 em{background:linear-gradient(90deg,var(--brand-a),var(--brand-b),var(--brand-c));-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.06em}
h2{font:italic 600 30px/1.08 var(--f-d);margin:0}.lead{color:var(--text-2);max-width:640px;margin:8px 0 0}
section{margin-top:34px}.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}.sh p{margin:4px 0 0;color:var(--text-2);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--raised);border-radius:99px;padding:9px 16px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:transform .15s var(--ease),border-color .2s}
.btn:hover{border-color:var(--muted)}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--text);color:var(--bg);border-color:var(--text)}.btn.grad{border:0;color:#fff;background:linear-gradient(120deg,var(--brand-a),var(--brand-b) 55%,var(--brand-c))}
.btn.sm{padding:6px 12px;font-size:13px}.btn svg{width:16px;height:16px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--raised);border-radius:99px;padding:7px 13px;font-size:13.5px;font-weight:600;cursor:pointer}
.chip[aria-pressed=true]{background:var(--text);color:var(--bg);border-color:var(--text)}.chip span{font:600 11px var(--f-m);opacity:.65}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}
.empty{padding:26px;border:1.5px dashed var(--line);border-radius:var(--r-md);color:var(--muted);text-align:center}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:var(--r-xl);padding:30px;color:#fff;min-height:220px;display:flex;flex-direction:column;justify-content:flex-end;
 background:radial-gradient(120% 120% at 0% 0%,color-mix(in srgb,var(--u-accent) 90%,#fff 10%),transparent 55%),linear-gradient(135deg,var(--u-accent),color-mix(in srgb,var(--u-primary) 80%,var(--u-accent)) 70%)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero .k{color:rgba(255,255,255,.85)}.hero h1{color:#fff}.hero p{margin:10px 0 18px;max-width:520px;color:rgba(255,255,255,.9)}
.hero .row{display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1}.hero .btn{background:#fff;color:#17151c;border:0}.hero .btn.ghost{background:rgba(255,255,255,.18);color:#fff}
/* checklist */
.check{display:flex;flex-direction:column;gap:2px;padding:10px}.ci{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px}
.ci i{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}.ci.done i{background:var(--good);border-color:var(--good)}
.ci.done i::after{content:"";width:9px;height:5px;border:2.5px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.ci b{font-size:14.5px}.ci.done b{color:var(--muted);text-decoration:line-through}.ci span{display:block;font-size:12.5px;color:var(--muted)}.ci .btn{margin-left:auto}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{aspect-ratio:1;border-radius:14px;border:1.5px solid var(--line);display:grid;place-items:center;font:800 15px var(--f-h);cursor:pointer;background:var(--raised)}
.day.on{background:linear-gradient(135deg,var(--brand-a),var(--brand-b));color:#fff;border:0}.day:disabled{opacity:.45;cursor:default}
.ci.cur{background:color-mix(in srgb,var(--coral) 9%,transparent)}.ci.cur i{border-color:var(--coral)}.ci.cur b{font-size:16px}.ci:not(.cur) b{color:var(--text-2)}.ci>div{min-width:0}
@media(max-width:1100px){.eng3>:last-child:nth-child(odd){grid-column:1/-1}}
@media(max-width:480px){.top{flex-wrap:wrap}.top>div:first-child{flex:1 1 100%}.top>.btn{align-self:flex-start}.ci{flex-wrap:wrap}.ci .btn{margin-left:36px}}
/* engines */
.eng{padding:22px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}.eng .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#fff}
.eng h3{margin:4px 0 0;font:700 19px var(--f-h)}.eng p{margin:0;color:var(--text-2);font-size:14px}.eng .btn{align-self:flex-start;margin-top:auto}
/* move cards */
.mc{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0;transition:transform .25s var(--ease),box-shadow .25s,border-color .2s}
.mc:focus-visible{outline-offset:3px;border-radius:var(--r-lg)}.mc:hover{transform:translateY(-3px);border-color:var(--line);box-shadow:var(--shadow)}
.mc .pv{height:auto;aspect-ratio:1/1}.mc .vidpv video,.mc .vidpv img{object-fit:cover;transition:transform .6s var(--ease)}.mc .vidpv::before{display:none}.mc .bd{padding:13px 14px 15px;display:flex;flex-direction:column;gap:5px}.mc .id{font:600 11px var(--f-m);color:var(--text-2);letter-spacing:.06em}
.mc .th{position:relative}.mc .mb{position:absolute;left:10px;right:10px;bottom:10px;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:6px;pointer-events:none}
.mc .mb span{display:inline-flex;align-items:center;gap:6px;font:700 11px var(--f-m);letter-spacing:.04em;color:#fff;background:rgba(15,12,20,.62);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:4px 9px;border-radius:99px;white-space:nowrap}
.mc .mb .lv::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--brand-c)}.mc .mb .lv.b::before{background:var(--good)}.mc .mb .lv.p::before{background:var(--brand-a)}
.mc .kick{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.mc .cat{font:700 10.5px var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--kick);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (hover:hover){.mc:hover .vidpv video,.mc:hover .vidpv img{transform:scale(1.04)}}
.sk{border-radius:var(--r-md);background:linear-gradient(100deg,var(--line-soft) 30%,var(--line) 50%,var(--line-soft) 70%);background-size:220% 100%;animation:sk 1.5s ease-in-out infinite}@keyframes sk{from{background-position:120% 0}to{background-position:-120% 0}}
.skw{display:grid;gap:14px}.skg{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.mc h4{margin:0;font:700 16px var(--f-h)}.mc p{margin:0;font-size:13px;color:var(--text-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}.tag{font:600 11px var(--f-m);border-radius:6px;padding:2px 7px;background:var(--line-soft);color:var(--text-2)}
.fav{position:absolute;z-index:3;right:10px;top:10px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.85);display:grid;place-items:center;cursor:pointer;color:#17151c}
.fav[aria-pressed=true]{background:var(--brand-b);color:#fff}
/* live previews (brand-colored, CSS only) */
.pv{position:relative;overflow:hidden;background:var(--u-bg);display:grid;place-items:center}
.phone{position:relative;height:82%;aspect-ratio:9/16;border-radius:14px;background:var(--u-bg);box-shadow:0 0 0 2px color-mix(in srgb,var(--u-primary) 12%,transparent),0 14px 26px -16px rgba(0,0,0,.4);overflow:hidden}
.pv .tx{position:absolute;left:10%;right:10%;font-family:var(--u-head);font-weight:800;color:var(--u-primary);font-size:9px;line-height:1.1}
@keyframes m-morph{0%,100%{width:46%;height:12%;border-radius:40px;background:var(--u-primary)}33%{width:70%;height:30%;border-radius:12px;background:var(--u-accent)}66%{width:30%;height:30%;border-radius:50%;background:var(--u-primary)}}
.pv-morph i{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);animation:m-morph 3.6s var(--ease) infinite}
@keyframes m-roll{0%{transform:translateY(0)}100%{transform:translateY(-80%)}}
.pv-count .nums{position:absolute;left:0;right:0;top:40%;height:20%;overflow:hidden;text-align:center;font:800 22px/1 var(--u-head);color:var(--u-accent)}.pv-count .nums div{animation:m-roll 3s steps(4) infinite}.pv-count .nums span{display:block;height:22px}
@keyframes m-bar{0%{transform:scaleY(.05)}60%,100%{transform:scaleY(1)}}
.pv-chart{}.pv-chart .bars{position:absolute;left:14%;right:14%;bottom:22%;height:46%;display:flex;align-items:flex-end;gap:8%}.pv-chart .bars i{flex:1;background:var(--u-primary);transform-origin:bottom;animation:m-bar 2.8s var(--ease) infinite;border-radius:4px 4px 0 0}
.pv-chart .bars i:nth-child(2){height:60%;animation-delay:.15s}.pv-chart .bars i:nth-child(3){height:85%;background:var(--u-accent);animation-delay:.3s}.pv-chart .bars i:nth-child(1){height:35%}
@keyframes m-cur{0%,15%{transform:translate(40px,60px)}45%,60%{transform:translate(0,0)}52%{transform:translate(0,0) scale(.8)}100%{transform:translate(40px,60px)}}
@keyframes m-pulse{45%,100%{opacity:0;transform:scale(1)}50%{opacity:.6;transform:scale(.3)}70%{opacity:0;transform:scale(1.6)}}
.pv-cursor .win{position:absolute;left:10%;right:10%;top:22%;height:44%;border-radius:8px;background:#fff;box-shadow:0 4px 10px rgba(0,0,0,.12)}.pv-cursor .win::before{content:"";position:absolute;left:10%;right:30%;top:20%;height:10%;border-radius:4px;background:var(--u-accent)}
.pv-cursor .win::after{content:"";position:absolute;left:10%;right:10%;top:44%;height:30%;border-radius:4px;background:color-mix(in srgb,var(--u-primary) 12%,#fff)}
.pv-cursor .cur{position:absolute;left:46%;top:36%;width:14px;height:18px;animation:m-cur 3s var(--ease) infinite}.pv-cursor .cur::before{content:"";position:absolute;inset:0;background:var(--u-primary);clip-path:polygon(0 0,0 100%,30% 72%,52% 100%,66% 92%,44% 66%,85% 66%)}
.pv-cursor .rip{position:absolute;left:41%;top:31%;width:22px;height:22px;border-radius:50%;border:2px solid var(--u-accent);animation:m-pulse 3s infinite}
@keyframes m-word{0%,8%{opacity:0;transform:translateY(6px) scale(.9)}14%,80%{opacity:1;transform:none}90%,100%{opacity:0}}
.pv-type .tx{top:36%;font-size:13px;text-align:center}.pv-type .tx span{display:inline-block;animation:m-word 3.2s var(--ease) infinite}.pv-type .tx span:nth-child(2){animation-delay:.25s;color:var(--u-accent)}.pv-type .tx span:nth-child(3){animation-delay:.5s}
@keyframes m-stack{0%{transform:translateY(120%) rotate(6deg)}30%,75%{transform:translateY(0) rotate(var(--r))}100%{transform:translateY(-140%) rotate(-4deg)}}
.pv-stack i{position:absolute;left:20%;right:20%;top:28%;height:40%;border-radius:10px;background:var(--u-primary);animation:m-stack 3.4s var(--ease) infinite}.pv-stack i:nth-child(2){--r:-6deg;background:var(--u-accent);animation-delay:.2s}.pv-stack i:nth-child(3){--r:4deg;background:#fff;animation-delay:.4s;box-shadow:0 6px 14px rgba(0,0,0,.15)}
@keyframes m-split{0%,20%{transform:translateX(-100%)}40%,80%{transform:none}100%{transform:translateX(100%)}}
.pv-split .a,.pv-split .b{position:absolute;top:0;bottom:0;width:50%}.pv-split .a{left:0;background:color-mix(in srgb,var(--u-primary) 85%,transparent)}.pv-split .b{right:0;background:var(--u-accent);animation:m-split 3.2s var(--ease) infinite}
.pv-split .tx{top:46%;color:#fff;text-align:center;font-size:10px;z-index:1}
@keyframes m-bub{0%,10%{opacity:0;transform:translateY(8px)}20%,85%{opacity:1;transform:none}100%{opacity:0}}
.pv-chat b{position:absolute;height:9%;border-radius:10px;animation:m-bub 3.4s var(--ease) infinite}.pv-chat b:nth-child(1){left:10%;width:55%;top:24%;background:color-mix(in srgb,var(--u-primary) 14%,#fff)}
.pv-chat b:nth-child(2){right:10%;width:48%;top:38%;background:var(--u-accent);animation-delay:.5s}.pv-chat b:nth-child(3){left:10%;width:62%;top:52%;background:color-mix(in srgb,var(--u-primary) 14%,#fff);animation-delay:1s}
@keyframes m-line{0%{transform:scaleX(0)}60%,100%{transform:scaleX(1)}}@keyframes m-dot{0%,30%{transform:scale(0)}45%,100%{transform:scale(1)}}
.pv-timeline .ln{position:absolute;left:14%;right:14%;top:50%;height:3px;background:var(--u-primary);transform-origin:left;animation:m-line 3s var(--ease) infinite}
.pv-timeline i{position:absolute;top:calc(50% - 6px);width:14px;height:14px;border-radius:50%;background:var(--u-accent);animation:m-dot 3s var(--ease) infinite}.pv-timeline i:nth-of-type(1){left:14%}.pv-timeline i:nth-of-type(2){left:44%;animation-delay:.3s}.pv-timeline i:nth-of-type(3){left:76%;animation-delay:.6s}
@keyframes m-glow{0%,100%{filter:drop-shadow(0 0 0 transparent);transform:scale(1)}50%{filter:drop-shadow(0 0 10px var(--u-accent));transform:scale(1.06)}}
.pv-glow .tx{top:40%;font-size:16px;text-align:center;color:var(--u-accent);animation:m-glow 2.4s ease-in-out infinite}
.pv .cap{position:absolute;left:12%;right:12%;bottom:20%;text-align:center;font:800 7.5px/1.2 var(--u-head);color:var(--u-primary)}.pv .cap mark{background:var(--u-accent);color:#fff;border-radius:3px;padding:0 2px}
.vidpv{background:#0d0c10;position:relative}.vidpv video,.vidpv img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;z-index:1}
.vidpv::before{content:"";position:absolute;inset:-24px;background:var(--bg,none) center/cover;filter:blur(24px) brightness(.5) saturate(1.2)}.vidpv .srcbadge{z-index:2}
.srcbadge{position:absolute;left:10px;top:10px;max-width:calc(100% - 64px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:1;font:700 10.5px var(--f-m);letter-spacing:.06em;background:rgba(0,0,0,.65);color:#fff;padding:3px 7px;border-radius:6px}
.embed{border-radius:14px;overflow:hidden;background:var(--raised);min-height:120px;display:flex;justify-content:center}

.cover{background:radial-gradient(120% 90% at 85% 10%,color-mix(in srgb,var(--ca) 38%,transparent),transparent 60%),var(--ci);color:#fff;place-items:stretch;overflow:hidden}
.cover .cv-grid{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.09) 1px,transparent 1.2px);background-size:18px 18px}
.cover .cv-glow{position:absolute;left:-30%;bottom:-60%;width:90%;height:120%;border-radius:50%;background:color-mix(in srgb,var(--ca) 30%,transparent);filter:blur(30px)}
.cover .cv-frame{position:absolute;right:16px;top:58px;border:1.5px solid color-mix(in srgb,#fff 45%,transparent);border-radius:7px;display:grid;place-items:center}
.cover .cv-frame.t{width:30px;height:52px}.cover .cv-frame.w{width:56px;height:32px}.cover .cv-frame.s{width:40px;height:40px}
.cover .cv-frame span{font:700 8.5px var(--f-m);opacity:.75}

// Featured order: moving previews first, then stills, then moves with no visual yet. Inside a tier the most dynamic
// categories lead and take turns (best of 3D, best of Kinetic Type, ...), so the first screen is varied, not one category.
const DYN = ["3D & Worlds", "Kinetic Type", "Characters & Story", "Motion", "UI Motion", "Generative Art", "Experimental", "Music Visuals", "Logo & Brand", "Data & Charts", "Creator Styles", "Product & Tools", "Social Formats", "Explainers"];

function featuredRank(moves) {

  for (const list of Object.values(byCat)) list.sort((a, b) => quality(b) - quality(a)).forEach((m, i) => rank.set(m.id, i));
  const ci = c => { const i = DYN.indexOf(c); return i < 0 ? DYN.length : i; };
  const fit = m => (["Beginner", "Easy"].includes(m.level) ? 0 : 1) + ((m.aspect || "9:16") === "9:16" ? 0 : 1);   // the first screen is what a beginner can make for Reels
  const cam = (S.brand || {}).face === "face", FOOT = ["Yap Edits", "Vlog Edits", "Viral Formats", "Captions", "Creator Styles"];
  const own = m => cam && FOOT.includes(m.category) ? 0 : 1, dyn = m => own(m) ? (ci(m.category) < DYN.length ? 0 : 1) : 0;   // on camera: moves for their own clips lead, still taking turns
  return (a, b) => visTier(b) - visTier(a) || fit(a) - fit(b) || own(a) - own(b) || dyn(a) - dyn(b) || rank.get(a.id) - rank.get(b.id) || ci(a.category) - ci(b.category);
}

  <label class="tgl"><input type="checkbox" id="htel" ${S.state.telemetry === true ? "checked" : ""}><span><b>Help improve setup (sends only pass/fail of each setup step and your OS, no files or names)</b></span></label></div>`;
VIEWS.help_after = () => { const h = $("#htel"); if (h) h.onchange = async () => { await saveState({ telemetry: h.checked }).catch(() => {}); toast(h.checked ? "Thanks. Only pass/fail of each setup step is sent." : "Turned off. Nothing more is sent."); }; };

// ---------- global clicks
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-move],[data-fav],[data-open],[data-done],[data-day],[data-eng],[data-copy],[data-claude],[data-lesson],[data-review],[data-exp],[data-long],[data-wall],[data-phone],[data-go],[data-opensub]"); if (!t) return;
  if (t.dataset.claude) { if ($("#dbody .rvl") && $("#drawer").contains(t)) closeDrawer(); return handoff(t.dataset.claude); }
  if (t.dataset.review) return openReview(t.dataset.review);
  if (t.dataset.exp) return exportSheet(t.dataset.exp, t);
  if (t.dataset.long) return longSheet(t.dataset.long, t.dataset.where || "Inbox", t);
  if (t.dataset.wall) return wallSheet(t.dataset.wall, t);
  if ("phone" in t.dataset) return phoneSheet(t);
  if (t.dataset.go) return goTo("#/make", () => composer(t.dataset.go));
  if (t.dataset.opensub) { const r = await api("/api/open", { dir: "exports", sub: t.dataset.opensub }).catch(() => ({})); return toast(r.ok ? "Opening the folder…" : "That folder isn't there any more."); }
  if (t.dataset.lesson) return doLesson(t.dataset.lesson);
  if (t.dataset.fav) { e.stopPropagation(); await toggleFav(t.dataset.fav); t.setAttribute("aria-pressed", isFav(t.dataset.fav)); return; }
  if (t.dataset.move) return openMove(t.dataset.move);
  if (t.dataset.open) { await api("/api/open", { dir: t.dataset.open }); return toast(`Opening your ${t.dataset.open} folder…`); }
  if (t.dataset.done) { await saveState({ done: { ...(S.state.done || {}), [t.dataset.done]: true } }); return route(); }
  if (t.dataset.day) { const d = +t.dataset.day, c = new Set(S.state.challenge || []); c.has(d) ? c.delete(d) : c.add(d); await saveState({ challenge: [...c] }); if (c.size === 7) confetti(); return route(); }
  if (t.dataset.eng) return composer(t.dataset.eng);
  if (t.dataset.copy) return copy(t.dataset.copy, t.dataset.msg);   // data-msg: a caption isn't for Claude, so it gets its own toast
});
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeDrawer(); closeSheet(); $("#pgm").classList.remove("on"); }
  if ($("#drawer").classList.contains("on") && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { if (e.key === "ArrowRight") stepMove(1); if (e.key === "ArrowLeft") stepMove(-1); }
  if (e.key === "/" && location.hash.startsWith("#/library") && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); $("#lq") && $("#lq").focus(); } if (e.key === "Enter" && e.target.matches(".mc")) e.preventDefault(), openMove(e.target.dataset.move); });
document.addEventListener("change", e => { const c = e.target.closest("[data-chk]"); if (!c) return;   // a script's filming checklist
  const all = { ...(S.state.script_checks || {}) }, s = new Set(all[c.dataset.chk] || []); c.checked ? s.add(+c.dataset.i) : s.delete(+c.dataset.i); all[c.dataset.chk] = [...s]; saveState({ script_checks: all }); });
$("#dx").onclick = closeDrawer; $("#scrim").onclick = closeDrawer;
{ const mo = new MutationObserver(syncLayers); for (const s of ["#pgm", "#ob", "#drawer"]) mo.observe($(s), { attributes: true, attributeFilter: ["class"] }); }
function confetti() { const c = document.createElement("div"); c.className = "confetti"; const cols = ["#ff5c4d", "#d93a2c", "#f2b85a", "#ffd9c7", "#15161b", "#ff8a6b"];
  c.innerHTML = Array.from({ length: 90 }, (_, i) => `<i style="left:${Math.random() * 100}%;background:${cols[i % 6]};animation-delay:${Math.random() * .6}s;animation-duration:${2 + Math.random() * 1.4}s"></i>`).join(""); document.body.appendChild(c); setTimeout(() => c.remove(), 4200); }

// ---------- ONBOARDING (2 minutes, one question per screen)
let OB = 0, OD = {};
const OSTEPS = [
 () => `<div class="k">Welcome</div><h1>Let's build <em>your</em> studio.</h1><p class="lead">Seven quick questions, about 2 minutes. Then every move in your library is set to your style.</p>
   <div class="field" style="margin-top:26px"><label for="o-name">What should we call you?</label><input class="input" id="o-name" value="${esc(OD.name || "")}" placeholder="Your first name" autofocus></div>`,
 () => `<div class="k">1 of 7 · You</div><h1>What do you make videos about?</h1><div class="opts">${NICHES.map(n => `<button class="chip" data-o-niche="${n}" aria-pressed="${OD.niche === n}">${n}</button>`).join("")}</div>
   <div class="field"><label for="o-niche">Or type your own</label><input class="input" id="o-niche" value="${esc(NICHES.includes(OD.niche) ? "" : OD.niche || "")}" placeholder="e.g. Plant care for beginners"></div>
   <div class="field"><label for="o-aud">Who are they for?</label><input class="input" id="o-aud" value="${esc(OD.audience || "")}" placeholder="e.g. busy moms who want to start a side project"></div>`,
 () => `<div class="k">2 of 7 · How you show up</div><h1>On camera, or behind it?</h1><div class="vibes v3">${[["face", "🎥", "On camera", "I talk to the camera"], ["faceless", "✍️", "Faceless", "Text, voiceover, stock clips"], ["both", "🔀", "Both", "A mix of everything"]].map(([id, a, n, s]) => `<button class="vibe" data-o-face="${id}" aria-pressed="${OD.face === id}"><div class="art" style="background:var(--line-soft)">${a}</div><div><b>${n}</b><span>${s}</span></div></button>`).join("")}</div>
   <h2 style="margin-top:26px">Where do you post?</h2><div class="opts">${PLATFORMS.map(p => `<button class="chip" data-o-plat="${p}" aria-pressed="${(OD.platforms || []).includes(p)}">${p}</button>`).join("")}</div>`,
 () => `<div class="k">3 of 7 · Vibe</div><h1>Pick a <em>vibe</em>.</h1><p class="lead">This sets your starting colors and fonts. You can tweak everything next.</p><div class="vibes">${VIBES.map(v => `<button class="vibe" data-o-vibe="${v.id}" aria-pressed="${OD.vibe === v.id}"><div class="art" style="background:${v.palette.bg};color:${v.palette.accent};font-family:'${FONTS[v.font].h}'"><span style="font-size:34px">${v.art}</span></div><div><b>${v.name}</b><span>${v.note}</span></div></button>`).join("")}</div>`,
 () => `<div class="k">4 of 7 · Your look</div><h1>Make it <em>yours</em>.</h1><div class="bk" style="margin-top:18px"><div id="obBrand">${brandEditor()}</div>${mock()}</div>`,
 () => `<div class="k">5 of 7 · Sound</div><h1>How should it <em>sound</em>?</h1><p class="lead">Your studio adds sound effects for you on every cut, pop and reveal. Tap ▶ to hear each style.</p><div id="obSnd">${soundPicker(OD)}</div>`,
 () => `<div class="k">6 of 7 · Goal</div><h1>What should viewers do?</h1><div class="field"><label for="o-cta">Your comment word (the word people comment to get your link or freebie)</label><input class="input" id="o-cta" value="${esc(OD.cta || "")}" placeholder="e.g. START"></div>
   <div class="field"><label>Your main goal right now</label><div class="opts" style="margin:0">${["Grow followers", "Get leads", "Sell my offer", "Build a habit of posting"].map(g => `<button class="chip" data-o-goal="${g}" aria-pressed="${OD.goal === g}">${g}</button>`).join("")}</div></div>`,
 () => `<div class="k">${UNLOCK_ONLY ? "Unlock" : "7 of 7 · Unlock"}</div><h1>Enter your <em>key</em>.</h1><p class="lead">It came in your purchase email. It unlocks the full library and every new drop.</p>
   <div class="field"><label for="o-key">Your key</label><input class="input" id="o-key" value="${esc(OD.key || "")}" placeholder="EW-XXXX-XXXX" style="font-family:var(--f-m);letter-spacing:.08em;text-transform:uppercase"></div><p id="o-keymsg" style="font-size:13px;color:var(--muted)"></p>
   ${S.licensed ? "" : `<button class="btn sm" id="o-demo">Use preview key</button>`}<p style="font-size:13px;color:var(--muted);margin-top:14px">Can't find it? Search your email for "Edit Wherever key". It starts with EW-. Still stuck? Reply to that email.</p>`,
 () => `<div class="k">All set</div><h1>Welcome to your studio, ${esc(OD.name || "creator")}.</h1><p class="lead">Your brand kit is saved and every move in the library now uses it. Let's get your first video done.</p>`];
let UNLOCK_ONLY = false;
function unlockScreen(msg) {   // library locked (no key, revoked, device limit, offline too long): straight to the key step
  startOnboarding(); OB = 7; UNLOCK_ONLY = true; drawOB(); if (msg) { $("#o-keymsg").textContent = msg; $("#o-keymsg").style.color = "var(--bad, #ff6b5c)"; }
}
function offlineScreen() {   // key saved but license server unreachable: not a key problem, so retry instead of key entry
  $("#ob").classList.add("on"); $(".obnav").style.display = "none";
  $("#obw").innerHTML = `<div class="k">Offline</div><h1>Can't reach <em>Edit Wherever</em> right now.</h1><p class="lead">Check your internet.</p><button class="btn grad" id="o-retry">Try again</button>`;
  $("#o-retry").onclick = async e => { const b = e.currentTarget; b.disabled = true; b.textContent = "Checking…"; const lib = await api("/api/library").catch(() => ({ locked: "offline" })); b.disabled = false; b.textContent = "Try again";
    if (!lib.locked) { S.moves = lib.moves; S.drops = lib.drops; $(".obnav").style.display = ""; $("#ob").classList.remove("on"); route(); return toast("Back online."); }
    if (lib.locked === "offline") return toast("Still can't connect. Check your internet."); $(".obnav").style.display = ""; unlockScreen(lib.message); };
}
function startOnboarding() {
  const b = S.brand; OD = b ? JSON.parse(JSON.stringify(b)) : { platforms: ["Instagram", "TikTok"], vibe: "editorial", face: "face", caption_style: "box", sound_style: "studio", sfx_density: "medium" };
  if (!OD.palette) { const v = VIBES.find(x => x.id === OD.vibe); OD.palette = { ...v.palette }; OD.heading_font = FONTS[v.font].h; OD.body_font = FONTS[v.font].b; }
  OB = 0; $("#ob").classList.add("on"); drawOB();
}
function drawOB() {
  draft = OD; applyBrand(OD);
  $("#obw").innerHTML = (UNLOCK_ONLY ? "" : `<div class="prog"><i style="width:${(OB / (OSTEPS.length - 1)) * 100}%"></i></div>`) + OSTEPS[OB]();   // unlock-only: no steps to go back to
  $("#obBack").style.visibility = OB && !UNLOCK_ONLY ? "visible" : "hidden"; $("#obNext").textContent = UNLOCK_ONLY ? "Unlock" : OB === OSTEPS.length - 1 ? "Open my studio" : OB === 0 ? "Let's go" : "Continue";
  const w = $("#obw"), on = (sel, fn) => w.querySelectorAll(sel).forEach(fn);
  on("[data-o-niche]", b => b.onclick = () => { OD.niche = b.dataset.oNiche; drawOB(); });
  on("[data-o-face]", b => b.onclick = () => { OD.face = b.dataset.oFace; drawOB(); });
  on("[data-o-plat]", b => b.onclick = () => { const s = new Set(OD.platforms || []); s.has(b.dataset.oPlat) ? s.delete(b.dataset.oPlat) : s.add(b.dataset.oPlat); OD.platforms = [...s]; drawOB(); });
  on("[data-o-vibe]", b => b.onclick = () => { const v = VIBES.find(x => x.id === b.dataset.oVibe); OD.vibe = v.id; OD.palette = { ...v.palette }; OD.heading_font = FONTS[v.font].h; OD.body_font = FONTS[v.font].b; drawOB(); });
  on("[data-o-goal]", b => b.onclick = () => { OD.goal = b.dataset.oGoal; drawOB(); });
  if (OB === 4) { const sf = $("#sndField"); if (sf) sf.remove(); bindBrand($("#obw"), null); }
  if (OB === 5) bindSound($("#obw"), OD, drawOB);
  const demo = $("#o-demo"); if (demo) demo.onclick = () => { $("#o-key").value = "EW-PREV-2026"; checkKey(); };
  const k = $("#o-key"); if (k) k.oninput = checkKey;
  const f = w.querySelector("input"); if (f && OB !== 4) f.focus();
  if (OB === OSTEPS.length - 1) confetti();
}
function checkKey() { const v = $("#o-key").value.trim().toUpperCase(), ok = /^EW-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(v); OD.key = v;
  $("#o-keymsg").textContent = !v ? "" : ok ? `Looks right. Tap ${$("#obNext").textContent} to check it.` : "Keys look like EW-AB12-CD34."; $("#o-keymsg").style.color = ok ? "var(--good-t)" : "var(--muted)"; return ok; }
function readOB() {
  const g = id => { const el = $("#" + id); return el ? el.value.trim() : null; };
  if (OB === 0) OD.name = g("o-name") || OD.name;
  if (OB === 1) { const t = g("o-niche"); if (t) OD.niche = t; OD.audience = g("o-aud") || OD.audience; }
  if (OB === 6) OD.cta = (g("o-cta") || OD.cta || "").toUpperCase();
  if (OB === 7) OD.key = (g("o-key") || "").toUpperCase();
}
function obValid() {
  if (OB === 0 && !OD.name) return "Add your name to continue";
  if (OB === 1 && !OD.niche) return "Pick or type what you make videos about";
  if (OB === 7 && !/^EW-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(OD.key || "")) return S.licensed ? "Enter your key" : "Enter your key (or tap \"Use preview key\")";
}
$("#obNext").onclick = async () => {
  readOB(); const err = obValid(); if (err) return toast(err);
  if (OB === 7) {   // real check against the license server; also registers this computer (2 per key)
    const nx = $("#obNext"), lbl = nx.textContent; nx.disabled = true; nx.innerHTML = '<i class="spin" style="width:16px;height:16px;border-width:2px"></i> Checking your key…'; $("#o-keymsg").textContent = "";
    const r = await api("/api/license", { key: OD.key }).catch(() => ({ ok: false, message: "Couldn't reach your studio. Is it still running?" })); nx.disabled = false; nx.textContent = lbl;
    if (!r.ok) { $("#o-keymsg").textContent = r.message; $("#o-keymsg").style.color = "var(--bad, #ff6b5c)"; return toast(r.message); }
    const lib = await api("/api/library"); S.moves = lib.moves; S.drops = lib.drops;
    if (UNLOCK_ONLY) { UNLOCK_ONLY = false; $("#ob").classList.remove("on"); route(); return toast("Unlocked. Welcome back."); }
  }
  if (OB < OSTEPS.length - 1) { OB++; return drawOB(); }
  OD.setup_done = new Date().toISOString(); S.brand = OD; await api("/api/brand", OD); applyBrand(OD);
  $("#ob").classList.remove("on"); location.hash = S.projects.length ? "#/home" : firstHref(); route();
};
$("#obBack").onclick = () => { readOB(); if (OB) { OB--; drawOB(); } };
$("#ob").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches("input:not([type=color]):not([type=checkbox])")) { e.preventDefault(); $("#obNext").click(); } });   // Enter in a field = Continue

// ---------- live progress: Claude writes .studio/jobs.json via scripts/job.mjs; new files in Projects = ready
let LASTP = null, BOOTED = false;
const VIDEO_FILE = /\.(mp4|mov|m4v|webm)$/i;   // jobs from before job.mjs wrote "kind"
function drawJob() {
  const j = (S.jobs || [])[0], bar = $("#jobbar"), ago = t => Math.max(1, Math.round((Date.now() - Date.parse(t)) / 60000));
  if (!j || (j.status === "done" && Date.now() - Date.parse(j.updated) > 10 * 60e3) || (j.status !== "running" && S.state.seen_job === j.id)) return bar.hidden = true;
  if (j.status === "done" && /^#\/projects/.test(location.hash)) return bar.hidden = true;   // already looking at it
  bar.hidden = false; bar.className = "jobbar " + j.status;
  bar.innerHTML = j.status === "running" ? `<i class="spin"></i><div><b>Claude is making "${esc(j.title)}"</b><span>${esc(j.step)} · ${ago(j.started)} min</span></div>`
    : j.status === "done" && (j.kind ? j.kind === "video" : VIDEO_FILE.test(j.file || "")) ? `<span class="ok">✓</span><div><b>Your video is ready</b><span>${esc(nm(j.file || j.title))}</span></div><a class="btn sm grad" href="#/projects">Watch it</a><button class="btn sm" data-seen="${esc(j.id)}" aria-label="Hide this">✕</button>`
    : j.status === "done" ? `<span class="ok">✓</span><div><b>${esc(j.note || "Claude is done")}</b><span>${esc(nm(j.title))}</span></div><a class="btn sm grad" href="#/projects">Open Projects</a><button class="btn sm" data-seen="${esc(j.id)}" aria-label="Hide this">✕</button>`
    : j.status === "stalled" ? `<span class="warn">!</span><div><b>Claude went quiet</b><span>Check the Claude window. It may be waiting for your answer.</span></div><button class="btn sm" data-seen="${esc(j.id)}">✕</button>`
    : `<span class="warn">!</span><div><b>Your video didn't finish</b><span>${esc(nm(j.title))} · ${esc(j.step)}</span></div><button class="btn sm grad" data-claude="${esc(`Fix my studio. My video "${j.title}" stopped with: ${j.step}. Check my Edit Wherever setup, repair anything that's broken, then tell me in one sentence what you fixed and how to try that video again.`)}">Fix it</button><button class="btn sm" data-seen="${esc(j.id)}" aria-label="Hide this">✕</button>`;
  bar.querySelectorAll("[data-seen]").forEach(b => b.onclick = async () => { await saveState({ seen_job: b.dataset.seen }); bar.hidden = true; });
}
async function poll() {
  if (document.hidden) return;
  const st = await api("/api/state").catch(() => null); $("#offline").hidden = !!st; if (!st) return;
  if (!BOOTED) return location.reload();   // studio came back after a failed boot
  const shape = () => JSON.stringify([S.inbox.map(v => v.name), S.projects.map(v => [v.name, v.review, v.exports, v.cover]), S.jobs, S.instagram, S.inbox_audio,   // Instagram status, posts and numbers redraw Trials too
    (S.trials || []).map(t => [t.name, t.publishing, t.insights, t.versions.map(v => [v.letter, v.added, v.posted, v.stats && (v.stats.updated || v.stats.entered)])])]), before = shape(), wasIG = IGS().connected;
  const sc = JSON.stringify(S.scripts);
  Object.assign(S, { inbox: st.inbox, projects: st.projects, jobs: st.jobs, styles: st.styles, trials: st.trials, instagram: st.instagram, inbox_audio: st.inbox_audio, scripts: st.scripts });
  if (IGWAIT && !wasIG && IGS().connected) { IGWAIT = false; toast(`Instagram connected${IGS().username ? ` as @${IGS().username}` : ""}`); }
  if (LASTP !== null && S.projects.length > LASTP) { toast("Your video is ready 🎉 It's in Projects."); confetti(); }
  LASTP = S.projects.length; drawJob(); milestone();
  const typing = /INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || "");
  const busy = typing || $("#drawer").classList.contains("on") || $("#pgm").classList.contains("on");
  if (before !== shape() && !busy && /^#\/(first|projects|trials|plan)/.test(location.hash)) { const y = scrollY; route(); scrollTo(0, y); }
  if (sc !== JSON.stringify(S.scripts) && !busy && /^#\/make/.test(location.hash)) $("#scripts").innerHTML = scriptsHTML();   // Make keeps its open composer
}
setInterval(poll, 4000);
function milestone() { if (S.projects.length && !S.state.first_video) saveState({ first_video: new Date().toISOString() }); }   // "first video made": the first file in Projects

// ---------- boot
(async function boot() {
  const [st, lib, starts] = await Promise.all([api("/api/state"), api("/api/library"), api("/previews/starts.json").catch(() => ({}))]).catch(() => []);
  STARTS = starts || {};
  if (!st || !lib) return $("#offline").hidden = false;   // poll() reloads the page once the studio is back
  BOOTED = true;
  Object.assign(S, st, { state: { favorites: [], done: {}, challenge: [], ...(st.state || {}) } }); S.moves = lib.moves; S.drops = lib.drops; milestone();
  applyBrand(S.brand); route(); LASTP = S.projects.length; drawJob();
  if (!S.brand || !S.brand.setup_done) startOnboarding();
  else if (lib.locked === "offline") offlineScreen();
  else if (lib.locked) unlockScreen(lib.message);
  else planReminder();
})();
